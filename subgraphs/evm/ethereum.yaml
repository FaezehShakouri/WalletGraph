specVersion: 1.3.0
schema:
  file: ../../schema.graphql
indexerHints:
  prune: never
dataSources:
  - kind: ethereum/contract
    name: USDC
    network: mainnet
    source:
      address: '0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48'
      abi: ERC20
      startBlock: 25966744
    context:
      chainId:
        type: String
        data: "eip155:1"
      chainName:
        type: String
        data: "Ethereum mainnet"
      datasetId:
        type: String
        data: "urn:walletgraph:usdc:ethereum:v0.1"
      startBlock:
        type: String
        data: "25966744"
      methodology:
        type: String
        data: "data:text/plain;charset=utf-8,WalletGraph%20USDC%20EVM%20adapter%200.1.0.%20Scope%3A%20Transfer%20logs%20emitted%20by%20the%20configured%20Circle%20USDC%20contract%20from%20startBlock%20inclusive.%20Each%20log%20is%20a%20low-level%20token%20transfer%2C%20not%20a%20decoded%20swap%20or%20deposit.%20Zero-address%20endpoints%20are%20mint%2Fburn%20markers%2C%20not%20owners.%20No%20fees%2C%20native%20ETH%2C%20reverted%20transactions%2C%20approvals%2C%20DeFi%20positions%2C%20prices%2C%20or%20other%20contracts%20are%20covered.%20balanceOf%20is%20read%20at%20the%20event%20block%20end%20for%20nonzero%20transfer%20participants%20only%3B%20readings%20are%20refreshed%20only%20when%20that%20address%20appears%20in%20another%20Transfer%20log.%20A%20failed%20state%20call%20produces%20UNKNOWN%2Fnull%2C%20never%20a%20replay-derived%20balance.%20Coverage%20watermark%20is%20the%20last%20matching%20event%20block%20and%20is%20conservative%20during%20empty%20blocks.%20Graph%20Node%20rollback%20must%20remove%20orphaned%20entities.%20No%20finality%20claim%20is%20stored.%20Dataset%20is%20public."
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Chain
        - Dataset
        - Coverage
        - Account
        - Asset
        - Block
        - Transaction
        - Activity
        - AccountActivity
        - ActivityRole
        - AssetEffect
        - Holding
        - BalanceObservation
      abis:
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: ./src/mapping.ts
